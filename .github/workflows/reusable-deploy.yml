name: Reusable Deploy Pipeline
# Each calling repo owns its deploy credentials, stored in its own `production`
# environment (Settings → Environments → production):
#   secrets:   DEPLOY_SSH_KEY (one key per service), DEPLOY_HOST
#   variables: DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`)
# The matching public key is bound to that one service on the host by
# scripts/add-deploy-key.sh, so a leaked key can only redeploy its own service.
# Org-level secrets are passed explicitly by the caller; never use `secrets: inherit`.
on:
  workflow_call:
    secrets:
      CF_API_TOKEN:
        required: false
      CF_ACCOUNT_ID:
        required: false
      CF_TUNNEL_ID:
        required: false
      CF_ZONE_ID:
        required: false
      SERVER_PUBLIC_IP:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # yq (mikefarah v4) ships with the GitHub-hosted Ubuntu images.
      - name: Read manifest
        id: manifest
        run: |
          echo "app=$(yq '.app' deploy.yml)"                 >> $GITHUB_OUTPUT
          echo "subdomain=$(yq '.subdomain' deploy.yml)"     >> $GITHUB_OUTPUT
          echo "port=$(yq '.internal_port' deploy.yml)"      >> $GITHUB_OUTPUT
          echo "cf_mode=$(yq '.cloudflare_mode' deploy.yml)" >> $GITHUB_OUTPUT

      - name: Build & push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE="ghcr.io/smartoys/${{ steps.manifest.outputs.app }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Cloudflare — DNS mode
        if: steps.manifest.outputs.cf_mode == 'dns'
        run: |
          ZONE="${{ secrets.CF_ZONE_ID }}"
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          NAME="${{ steps.manifest.outputs.subdomain }}"
          IP="${{ secrets.SERVER_PUBLIC_IP }}"

          RECORD_ID=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$NAME&type=A" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.result[0].id // empty')

          if [[ -n "$RECORD_ID" ]]; then
            curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$IP\",\"proxied\":true}"
          else
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$IP\",\"proxied\":true}"
          fi

      - name: Cloudflare — Tunnel mode
        if: steps.manifest.outputs.cf_mode == 'tunnel'
        env:
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TUNNEL_ID:  ${{ secrets.CF_TUNNEL_ID }}
          CF_ZONE_ID:    ${{ secrets.CF_ZONE_ID }}
          SUBDOMAIN:     ${{ steps.manifest.outputs.subdomain }}
        run: |
          pip install requests --quiet
          python3 - <<'EOF'
          import os, requests

          token   = os.environ["CF_API_TOKEN"]
          account = os.environ["CF_ACCOUNT_ID"]
          tunnel  = os.environ["CF_TUNNEL_ID"]
          zone    = os.environ["CF_ZONE_ID"]
          host    = os.environ["SUBDOMAIN"]
          service = "http://traefik:80"

          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # ── 1. Update tunnel ingress rule ────────────────────────────────────
          tunnel_base = f"https://api.cloudflare.com/client/v4/accounts/{account}/cfd_tunnel/{tunnel}/configurations"

          r = requests.get(tunnel_base, headers=headers)
          r.raise_for_status()
          config  = r.json()["result"]["config"]
          ingress = config.get("ingress", [])

          catch_all   = [i for i in ingress if "hostname" not in i]
          others      = [i for i in ingress if i.get("hostname") and i["hostname"] != host]
          new_rule    = {"hostname": host, "service": service}
          new_ingress = [new_rule] + others + catch_all

          r2 = requests.put(tunnel_base, headers=headers,
               json={"config": {**config, "ingress": new_ingress}})
          r2.raise_for_status()
          print(f"Tunnel ingress updated: {host} -> {service}")

          # ── 2. Create/update DNS CNAME record ────────────────────────────────
          dns_base   = f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records"
          cname_data = {
              "type":    "CNAME",
              "name":    host,
              "content": f"{tunnel}.cfargotunnel.com",
              "proxied": True
          }

          r3 = requests.get(dns_base, headers=headers,
               params={"name": host, "type": "CNAME"})
          r3.raise_for_status()
          records = r3.json().get("result", [])

          if records:
              record_id = records[0]["id"]
              r4 = requests.put(f"{dns_base}/{record_id}", headers=headers, json=cname_data)
              r4.raise_for_status()
              print(f"DNS CNAME updated: {host} -> {cname_data['content']}")
          else:
              r4 = requests.post(dns_base, headers=headers, json=cname_data)
              r4.raise_for_status()
              print(f"DNS CNAME created: {host} -> {cname_data['content']}")
          EOF

      # OAuth client limited to tag:ci; the tailnet ACL lets tag:ci reach only
      # the deploy host on port 22. No long-lived auth key is stored anywhere.
      - name: Connect Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The host decides which service this key deploys (forced command); the
      # only thing sent is the image tag, as the SSH command.
      - name: Deploy via SSH
        env:
          DEPLOY_SSH_KEY:     ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST:        ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_HOST" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_KNOWN_HOSTS must be set on this repo's production environment"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "deploy@$DEPLOY_HOST" "${{ github.sha }}"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_ed25519
